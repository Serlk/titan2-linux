%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/mediatek,mt6375.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6375 SubPMIC

maintainers:
  - serlk <22211586+Serlk@users.noreply.github.com>

description: |
  The MT6375 integrates a switching single cell Li-ion charger with BC1.2
  detection, an ADC, a coulomb counter and a USB Type-C/PD port controller.
  It answers on several I2C addresses; the node describes the PMU address
  0x34, the others are derived from it. The device collects the events of
  all blocks and signals them on one interrupt line.

properties:
  compatible:
    const: mediatek,mt6375

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-controller: true

  "#interrupt-cells":
    const: 1
    description:
      The event number, 8 * (register - 0x1d0) + bit.

  adc:
    type: object
    additionalProperties: false
    description: |
      The ADC: one-shot conversions of the charger and Type-C port voltages
      and currents and the die temperature. The channel numbers are in
      include/dt-bindings/iio/adc/mediatek,mt6375-adc.h.

    properties:
      compatible:
        const: mediatek,mt6375-adc

      "#io-channel-cells":
        const: 1

    required:
      - compatible
      - "#io-channel-cells"

  charger:
    type: object
    additionalProperties: false
    description: The switching charger.

    properties:
      compatible:
        const: mediatek,mt6375-chg

      interrupts:
        minItems: 1
        maxItems: 6

      interrupt-names:
        minItems: 1
        maxItems: 6
        items:
          enum: [ pwr_rdy, detach, vbus_ov, chg_tout, chg_batov, bc12_dn ]

      io-channels:
        items:
          - description: VBUS at the charger input
          - description: charger input current

      io-channel-names:
        items:
          - const: vbus
          - const: ibus

      monitored-battery:
        description: |
          Battery the charger feeds. Its constant-charge-voltage-max-microvolt
          and constant-charge-current-max-microamp are the upper limits the
          driver programs and accepts; without them the charger is only
          monitored. operating-range-celsius is the charging window and
          charge-term-current-microamp the termination current.

    required:
      - compatible

  tcpc:
    type: object
    additionalProperties: false
    description: The USB Type-C/Power Delivery port controller.

    properties:
      compatible:
        const: mediatek,mt6375-tcpc

      interrupts:
        maxItems: 1

      interrupt-names:
        const: pd_evt

      connector:
        type: object
        $ref: /schemas/connector/usb-connector.yaml#
        unevaluatedProperties: false

    required:
      - compatible
      - interrupts
      - interrupt-names
      - connector

required:
  - compatible
  - reg
  - interrupts
  - interrupt-controller
  - "#interrupt-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/usb/pd.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@34 {
            compatible = "mediatek,mt6375";
            reg = <0x34>;
            interrupts = <15 IRQ_TYPE_LEVEL_LOW>;
            interrupt-controller;
            #interrupt-cells = <1>;

            mt6375_adc: adc {
                compatible = "mediatek,mt6375-adc";
                #io-channel-cells = <1>;
            };

            charger {
                compatible = "mediatek,mt6375-chg";
                interrupts = <0>, <1>, <8>, <11>, <9>, <31>;
                interrupt-names = "pwr_rdy", "detach", "vbus_ov",
                                  "chg_tout", "chg_batov", "bc12_dn";
                io-channels = <&mt6375_adc 1>, <&mt6375_adc 5>;
                io-channel-names = "vbus", "ibus";
            };

            tcpc {
                compatible = "mediatek,mt6375-tcpc";
                interrupts = <120>;
                interrupt-names = "pd_evt";

                connector {
                    compatible = "usb-c-connector";
                    data-role = "device";
                    power-role = "sink";
                    self-powered;
                    sink-pdos = <PDO_FIXED(5000, 2000, PDO_FIXED_USB_COMM)>;
                    op-sink-microwatt = <10000000>;
                };
            };
        };
    };
