%YAML 1.2
---
$id: http://devicetree.org/schemas/power/mediatek,mt8196-gpufreq.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MFlexGraphics Power and Frequency Controller

maintainers:
  - Nicolas Frattaroli <nicolas.frattaroli@collabora.com>

description: |
  A special-purpose embedded MCU to control power and frequency of GPU devices
  using MediaTek Flexible Graphics integration hardware.

  On the MT6878, the boot firmware loads and starts the MCU in the MFG0 power
  domain, and the MCU drives the GPU supplies, PLLs and power domains itself.
  The operating system only sends it requests through the mailbox, and does
  not control any of its clocks or supplies.

properties:
  $nodename:
    pattern: '^power-controller@[a-f0-9]+$'

  compatible:
    enum:
      - mediatek,mt6878-gpufreq
      - mediatek,mt8196-gpufreq

  reg:
    minItems: 1
    items:
      - description: GPR memory area
      - description: RPC memory area
      - description: SoC variant ID register

  reg-names:
    minItems: 1
    items:
      - const: gpr
      - const: rpc
      - const: hw-revision

  clocks:
    items:
      - description: main clock of the embedded controller (EB)
      - description: core PLL
      - description: stack 0 PLL
      - description: stack 1 PLL

  clock-names:
    items:
      - const: eb
      - const: core
      - const: stack0
      - const: stack1

  mboxes:
    minItems: 1
    items:
      - description: FastDVFS events
      - description: frequency control
      - description: sleep control
      - description: timer control
      - description: frequency hopping control
      - description: hardware voter control
      - description: FastDVFS control

  mbox-names:
    minItems: 1
    items:
      - const: fast-dvfs-event
      - const: gpufreq
      - const: sleep
      - const: timer
      - const: fhctl
      - const: ccf
      - const: fast-dvfs

  memory-region:
    items:
      - description: phandle to the GPUEB shared memory

  mediatek,scpsys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the SCPSYS syscon holding the power control register of the
      MFG0 domain the MCU runs in, to check that it is up before the MCU SRAM
      is accessed.

  "#clock-cells":
    const: 1

  "#nvmem-cell-cells":
    const: 0

  "#power-domain-cells":
    const: 0

  shader-present:
    type: object

dependencies:
  shader-present: [ "#nvmem-cell-cells" ]

required:
  - compatible
  - reg
  - reg-names
  - mboxes
  - mbox-names
  - "#clock-cells"
  - "#power-domain-cells"

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: mediatek,mt6878-gpufreq
    then:
      description:
        The shared memory is a carveout the bootloader creates, which has no
        phandle. Without memory-region, the reserved-memory node compatible
        with "mediatek,me_GPUEB_SHARED" is used.
      properties:
        reg:
          maxItems: 1
        reg-names:
          maxItems: 1
        clocks: false
        clock-names: false
        mboxes:
          maxItems: 1
        mbox-names:
          maxItems: 1
      required:
        - mediatek,scpsys
    else:
      properties:
        reg:
          minItems: 3
        reg-names:
          minItems: 3
        mboxes:
          minItems: 7
        mbox-names:
          minItems: 7
        mediatek,scpsys: false
      required:
        - clocks
        - clock-names
        - memory-region

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mediatek,mt8196-clock.h>

    power-controller@4b09fd00 {
        compatible = "mediatek,mt8196-gpufreq";
        reg = <0x4b09fd00 0x80>,
              <0x4b800000 0x1000>,
              <0x4b860128 0x4>;
        reg-names = "gpr", "rpc", "hw-revision";
        clocks = <&topckgen CLK_TOP_MFG_EB>,
                 <&mfgpll CLK_MFG_AO_MFGPLL>,
                 <&mfgpll_sc0 CLK_MFGSC0_AO_MFGPLL_SC0>,
                 <&mfgpll_sc1 CLK_MFGSC1_AO_MFGPLL_SC1>;
        clock-names = "eb", "core", "stack0", "stack1";
        mboxes = <&gpueb_mbox 0>, <&gpueb_mbox 1>, <&gpueb_mbox 2>,
                 <&gpueb_mbox 3>, <&gpueb_mbox 4>, <&gpueb_mbox 5>,
                 <&gpueb_mbox 7>;
        mbox-names = "fast-dvfs-event", "gpufreq", "sleep", "timer", "fhctl",
                     "ccf", "fast-dvfs";
        memory-region = <&gpueb_shared_memory>;
        #clock-cells = <1>;
        #nvmem-cell-cells = <0>;
        #power-domain-cells = <0>;

        shader-present {
        };
    };

  - |
    power-controller@13c3fd1c {
        compatible = "mediatek,mt6878-gpufreq";
        reg = <0x13c3fd1c 0x64>;
        reg-names = "gpr";
        mboxes = <&gpueb_mbox 1>;
        mbox-names = "gpufreq";
        mediatek,scpsys = <&scpsys>;
        #clock-cells = <1>;
        #nvmem-cell-cells = <0>;
        #power-domain-cells = <0>;
    };
