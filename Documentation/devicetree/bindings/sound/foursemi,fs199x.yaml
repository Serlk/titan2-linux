%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/foursemi,fs199x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FourSemi FS199x Smart Audio Amplifier

maintainers:
  - serlk <22211586+Serlk@users.noreply.github.com>

description:
  Mono Class-D smart amplifier with a DSP for speaker protection, digital
  audio input over I2S, controlled over I2C. The register settings, the
  speaker model and the DSP effects come from a FourSemi firmware file.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: foursemi,fs199x

  reg:
    maxItems: 1

  '#sound-dai-cells':
    const: 0

  pvdd-supply:
    description: Power stage supply (PVDD).

  dvdd-supply:
    description: Digital supply (DVDD).

  reset-gpios:
    maxItems: 1
    description:
      The SDZ pin, active low; asserted, it shuts the chip down.

  firmware-name:
    maxItems: 1
    description:
      FourSemi firmware file with the register scenes, the speaker model and
      the DSP effect parameters, generated by the FourSemi tuning tool for
      the speaker of the board.

  foursemi,speaker-re:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Nominal DC resistance of the speaker in the unit of the FourSemi
      tools, used for the speaker protection when the chip has no
      calibrated value in its OTP.

required:
  - compatible
  - reg
  - '#sound-dai-cells'
  - firmware-name

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        audio-amplifier@34 {
            compatible = "foursemi,fs199x";
            reg = <0x34>;
            #sound-dai-cells = <0>;
            reset-gpios = <&gpio 29 GPIO_ACTIVE_LOW>;
            firmware-name = "frsm-spk1.bin";
            foursemi,speaker-re = <0x67fd>;
        };
    };
