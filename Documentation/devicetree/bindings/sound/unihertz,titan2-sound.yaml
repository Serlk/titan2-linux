%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/unihertz,titan2-sound.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unihertz Titan 2 sound card

maintainers:
  - serlk <22211586+Serlk@users.noreply.github.com>

description:
  MT6878 audio front end with the MT6369 PMIC codec on the ADDA link
  (receiver, headset over USB-C, microphones) and a FourSemi FS199x
  amplifier on I2SOUT4 for the loudspeaker.

allOf:
  - $ref: sound-card-common.yaml#

properties:
  compatible:
    const: unihertz,titan2-sound

  audio-routing:
    description:
      Valid names are the input and output widgets of the codecs and the
      card widgets "Speaker", "Earpiece", "Headphones", "Main Mic",
      "Second Mic" and "Headset Mic".

  mediatek,platform:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The phandle of the MT6878 AFE.

patternProperties:
  "^dai-link-[0-9]+$":
    type: object
    description:
      Container for dai-link level properties and CODEC sub-nodes.

    properties:
      link-name:
        description: Name of the BE dai-link the node applies to.
        enum:
          - ADDA_BE
          - I2SOUT4_BE
          - I2SIN4_BE

      codec:
        description: Holds subnode which indicates codec dai.
        type: object
        additionalProperties: false
        properties:
          sound-dai:
            minItems: 1
            maxItems: 2
        required:
          - sound-dai

      dai-format:
        description: audio format.
        enum:
          - i2s
          - right_j
          - left_j
          - dsp_a
          - dsp_b

      mediatek,clk-provider:
        $ref: /schemas/types.yaml#/definitions/string
        description: Indicates dai-link clock master.
        enum:
          - cpu
          - codec

    additionalProperties: false

    required:
      - link-name

required:
  - compatible
  - audio-routing
  - mediatek,platform

unevaluatedProperties: false

examples:
  - |
    sound {
        compatible = "unihertz,titan2-sound";
        model = "Titan2";
        mediatek,platform = <&afe>;
        audio-routing =
            "Headphones", "Headphone L",
            "Headphones", "Headphone R",
            "Earpiece", "Receiver",
            "Speaker", "SPK",
            "AIN0", "Main Mic",
            "AIN1", "Headset Mic",
            "AIN2", "Second Mic";

        dai-link-0 {
            link-name = "ADDA_BE";
            codec {
                sound-dai = <&mt6369_codec>;
            };
        };

        dai-link-1 {
            link-name = "I2SOUT4_BE";
            dai-format = "i2s";
            mediatek,clk-provider = "cpu";
            codec {
                sound-dai = <&speaker_amp>;
            };
        };
    };

...
