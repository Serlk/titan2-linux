%YAML 1.2
---
$id: http://devicetree.org/schemas/net/wireless/mediatek,mt6878-wifi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6878 CONNSYS Wi-Fi

maintainers:
  - serlk <22211586+Serlk@users.noreply.github.com>

description:
  The Wi-Fi 6 core (MT7921 class, CONNAC2) of the connectivity subsystem
  (CONNSYS) of MediaTek MT6878, attached to the AP over AXI. It is powered
  through CONNINFRA. The boot loader loads its firmware into the CONNSYS
  EMI and carves out the DMA pool for the WFDMA rings; it adds the
  memory-region phandle to this node and reads the emi-* properties.

allOf:
  - $ref: ieee80211.yaml#

properties:
  compatible:
    const: mediatek,mt6878-wifi

  reg:
    maxItems: 1
    description:
      CONNSYS register window as seen from the AP, CONN_INFRA at offset 0
      and WFSYS at offset 0x400000 (0x700000 bytes)

  interrupts:
    items:
      - description: WFDMA interrupt
      - description: WF to AP software interrupt (CCIF)

  interrupt-names:
    items:
      - const: wfdma
      - const: sw

  memory-region:
    maxItems: 1
    description:
      shared-dma-pool for the WFDMA rings, added by the boot loader

  mediatek,conninfra:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: CONNINFRA node powering CONNSYS

  emi-size:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Size of the WFDMA pool, read by the boot loader only

  emi-alignment:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Alignment of the WFDMA pool, read by the boot loader only

  emi-max-addr:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Upper limit for the WFDMA pool, read by the boot loader only

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - mediatek,conninfra

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    wifi@18000000 {
        compatible = "mediatek,mt6878-wifi";
        reg = <0x18000000 0x700000>;
        interrupts = <GIC_SPI 484 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 692 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "wfdma", "sw";
        mediatek,conninfra = <&consys>;
        emi-size = <0x1400000>;
        emi-alignment = <0x1000000>;
        emi-max-addr = <0xc0000000>;
    };
