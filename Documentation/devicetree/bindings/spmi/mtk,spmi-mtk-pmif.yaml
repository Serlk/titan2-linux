%YAML 1.2
---
$id: http://devicetree.org/schemas/spmi/mtk,spmi-mtk-pmif.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Mediatek SPMI Controller

maintainers:
  - Hsin-Hsiung Wang <hsin-hsiung.wang@mediatek.com>

description: |+
  On MediaTek SoCs the PMIC is connected via SPMI and the controller allows
  for multiple SoCs to control a single SPMI master.

  The SPMI 2.0 variants also act as an interrupt controller for the Request
  Capable Slave (RCS) interrupts raised by the devices on the bus.

allOf:
  - $ref: spmi.yaml
  - if:
      properties:
        compatible:
          contains:
            const: mediatek,mt6878-spmi
    then:
      properties:
        clocks: false
        clock-names: false
        assigned-clocks: false
        assigned-clock-parents: false
      required:
        - interrupts
        - interrupt-names
        - interrupt-controller
        - "#interrupt-cells"
    else:
      properties:
        interrupts: false
        interrupt-names: false
        interrupt-controller: false
        "#interrupt-cells": false
      required:
        - clocks
        - clock-names

properties:
  compatible:
    oneOf:
      - enum:
          - mediatek,mt6873-spmi
          - mediatek,mt6878-spmi
          - mediatek,mt8195-spmi
      - items:
          - enum:
              - mediatek,mt8186-spmi
              - mediatek,mt8188-spmi
              - mediatek,mt8189-spmi
          - const: mediatek,mt8195-spmi

  reg:
    maxItems: 2

  reg-names:
    items:
      - const: pmif
      - const: spmimst

  clocks:
    minItems: 3
    maxItems: 3

  clock-names:
    items:
      - const: pmif_sys_ck
      - const: pmif_tmr_ck
      - const: spmimst_clk_mux

  assigned-clocks:
    maxItems: 1

  assigned-clock-parents:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-names:
    const: rcs

  interrupt-controller: true

  "#interrupt-cells":
    const: 3
    description: |
      cell 1: slave ID for the requested interrupt (0-15)
      cell 2: the requested peripheral interrupt (0-7)
      cell 3: interrupt flags indicating level-sense information,
              as defined in dt-bindings/interrupt-controller/irq.h

required:
  - compatible
  - reg
  - reg-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/mt8192-clk.h>

    spmi: spmi@10027000 {
        compatible = "mediatek,mt6873-spmi";
        reg = <0x10027000 0xe00>,
              <0x10029000 0x100>;
        reg-names = "pmif", "spmimst";
        clocks = <&infracfg CLK_INFRA_PMIC_AP>,
                 <&infracfg CLK_INFRA_PMIC_TMR>,
                 <&topckgen CLK_TOP_SPMI_MST_SEL>;
        clock-names = "pmif_sys_ck",
                      "pmif_tmr_ck",
                      "spmimst_clk_mux";
        assigned-clocks = <&topckgen CLK_TOP_PWRAP_ULPOSC_SEL>;
        assigned-clock-parents = <&topckgen CLK_TOP_OSC_D10>;
    };

  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    spmi@1cc04000 {
        compatible = "mediatek,mt6878-spmi";
        reg = <0x1cc04000 0x900>,
              <0x1cc01000 0x100>;
        reg-names = "pmif", "spmimst";
        interrupts-extended = <&pio 212 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "rcs";
        interrupt-controller;
        #interrupt-cells = <3>;
        #address-cells = <2>;
        #size-cells = <0>;
    };
...
