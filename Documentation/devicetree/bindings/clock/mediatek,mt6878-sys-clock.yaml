%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt6878-sys-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek System Clock Controller for MT6878

maintainers:
  - Igor Belwon <igor.belwon@mentallysanemainliners.org>

description: |
  The clock architecture in MediaTek SoCs is structured like below:
  PLLs -->
          dividers -->
                      muxes
                           -->
                              clock gate

  The apmixedsys, mfgpll and mfgscpll blocks provide the PLLs, generated
  from the SoC's 26 MHz crystal oscillator. The topckgen and vlpckgen
  blocks provide dividers and muxes which feed the other IP blocks.

  The clock IDs are defined in
  include/dt-bindings/clock/mediatek,mt6878-clock.h.

properties:
  compatible:
    items:
      - enum:
          - mediatek,mt6878-apmixedsys
          - mediatek,mt6878-mfgpll-pll-ctrl
          - mediatek,mt6878-mfgscpll-pll-ctrl
          - mediatek,mt6878-topckgen
          - mediatek,mt6878-vlpckgen
      - const: syscon

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

  mediatek,hardware-voter:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the hardware voter (HWV) syscon, an alternative interface
      through which some of the PLLs and muxes of this block are also
      switched by other processors. See mediatek,mt8196-sys-clock.yaml.

required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller@1000c000 {
        compatible = "mediatek,mt6878-apmixedsys", "syscon";
        reg = <0x1000c000 0x1000>;
        mediatek,hardware-voter = <&hwv>;
        #clock-cells = <1>;
    };
  - |
    clock-controller@1c012000 {
        compatible = "mediatek,mt6878-vlpckgen", "syscon";
        reg = <0x1c012000 0x1000>;
        #clock-cells = <1>;
    };
